; Shared configuration for the reTerminal E-series (XIAO ESP32S3 core).
; Each device env below extends this and adds its own device flag plus the
; two provider selections (UM_ENABLE_<X> + UM_<X>_SIDE=1|2, where 1=LEFT 2=RIGHT).
[reterminal_base]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-s3-sense
framework = arduino
upload_speed = 115200
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
extra_scripts = pre:scripts/ensure_deps.py
build_flags =
    -D BOARD_HAS_PSRAM
    -I src
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX
    bblanchon/ArduinoJson@^7.0.0

; Default: Codex (left) + Claude (right) on E1003.
[env:reterminal_e1003]
extends = reterminal_base
build_flags =
    ${reterminal_base.build_flags}
    -D UM_DEVICE_E1003
    -D UM_ENABLE_CODEX  -D UM_CODEX_SIDE=1
    -D UM_ENABLE_CLAUDE -D UM_CLAUDE_SIDE=2

[env:reterminal_e1001]
extends = reterminal_base
build_flags =
    ${reterminal_base.build_flags}
    -D UM_DEVICE_E1001
    -D UM_ENABLE_CODEX  -D UM_CODEX_SIDE=1
    -D UM_ENABLE_CLAUDE -D UM_CLAUDE_SIDE=2

[env:reterminal_e1002]
extends = reterminal_base
build_flags =
    ${reterminal_base.build_flags}
    -D UM_DEVICE_E1002
    -D UM_ENABLE_CODEX  -D UM_CODEX_SIDE=1
    -D UM_ENABLE_CLAUDE -D UM_CLAUDE_SIDE=2

; Chinese (Simplified) build for the E1003 with Codex + Claude.
[env:reterminal_e1003_zh]
extends = reterminal_base
build_flags =
    ${reterminal_base.build_flags}
    -D UM_DEVICE_E1003
    -D UM_UI_LANG_ZH
    -D UM_ENABLE_CODEX  -D UM_CODEX_SIDE=1
    -D UM_ENABLE_CLAUDE -D UM_CLAUDE_SIDE=2
lib_deps =
    ${reterminal_base.lib_deps}
    https://github.com/takkaO/OpenFontRender.git
extra_scripts =
    pre:scripts/ensure_deps.py
    pre:scripts/gen_font.py

; Example: Copilot (left) + Claude (right) on E1003.
[env:reterminal_e1003_copilot_claude]
extends = reterminal_base
build_flags =
    ${reterminal_base.build_flags}
    -D UM_DEVICE_E1003
    -D UM_ENABLE_COPILOT -D UM_COPILOT_SIDE=1
    -D UM_ENABLE_CLAUDE  -D UM_CLAUDE_SIDE=2

; Example: Codex (left) + Zai/Zhipu (right) on E1003.
[env:reterminal_e1003_codex_zai]
extends = reterminal_base
build_flags =
    ${reterminal_base.build_flags}
    -D UM_DEVICE_E1003
    -D UM_ENABLE_CODEX -D UM_CODEX_SIDE=1
    -D UM_ENABLE_ZAI   -D UM_ZAI_SIDE=2

; Same as above, plus optional computer-side local stats.
[env:reterminal_e1003_codex_zai_local]
extends = reterminal_base
build_flags =
    ${reterminal_base.build_flags}
    -D UM_DEVICE_E1003
    -D UM_ENABLE_CODEX -D UM_CODEX_SIDE=1
    -D UM_ENABLE_ZAI   -D UM_ZAI_SIDE=2
    -D UM_ENABLE_LOCAL_STATS

; Example: MiniMax (left) + Zai (right) on E1003.
[env:reterminal_e1003_minimax_zai]
extends = reterminal_base
build_flags =
    ${reterminal_base.build_flags}
    -D UM_DEVICE_E1003
    -D UM_ENABLE_MINIMAX -D UM_MINIMAX_SIDE=1 -D UM_MINIMAX_REGION=0
    -D UM_ENABLE_ZAI     -D UM_ZAI_SIDE=2

[env:native]
platform = native
build_flags =
    -std=c++11
    -I src
